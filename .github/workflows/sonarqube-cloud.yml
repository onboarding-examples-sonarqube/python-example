on:
  # Trigger analysis when pushing to your main branches, and when creating a pull request.
  push:
    paths:
      - 'src/**'
    branches: [main, master, develop, 'releases/**']
  pull_request:
      types: [opened, synchronize, reopened]
  workflow_dispatch:

name: SonarQube-Cloud
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6 # See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONARQUBE_CLOUD_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      with:
        args: >
          -Dsonar.verbose=true
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.sources=src/
          -Dsonar.organization=github-onboarding-examples
          -Dsonar.projectKey=onboarding-examples-sonarqube-gh_python-example
          "-Dsonar.projectName=Onboarding Example - GitHub - Python Example"
          
